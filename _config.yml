        quote: >
           SPFx Apps; PowerShell Scripting; SharePoint Online Intranet Portal; SharePoint 2016 to SharePoint Online Migration; SharePoint 2007 to 2016 Migration.
        description: | # this will include new lines to allow paragraphs
        
            •	PowerApps Solutions: Developed and migrated various Canvas and model-driven apps using Power Apps with Dataverse and other connectors to meet specific business requirements like Approval Canvas app that addressing gaps in Power Automate approval flows with additional features like reassignment, reminders, and print capabilities. This also included rebuilding multiple InfoPath Forms into Power Apps.
            •	Power Automate flows: Migrated and developed custom designer workflows and out-of-the-box (OOTB) workflows into Power Automate using SPMT, improving workflow management.
            •	Self-Service Provisioning Engine: Designed and implemented a Self-Service Provisioning Engine in SharePoint, automating custom site creation and reducing site creation time by 50% using Power Shell Scripts, JSON, PowerApps Canvas Apps and Power Automate Flows. 
            •	Process Automation and Efficiency: Spearheaded automated processes for Shared Drive File Transfer, increasing efficiency by 40% and maintaining data integrity using SharePoint Migration Manager and SPMT, standardizing procedures for SharePoint Online, MS Teams, and OneDrive migrations.
            •	Data Management and Reporting: Developed a PowerShell script leveraging parallel processing to scan network shared drives, calculate data sizes, and generate CSV outputs. Integrated this data into Power BI dashboards for executive insights and progress tracking.
            •	SharePoint Migration and Upgrade Management: Directed the migration of 11TB of SharePoint 2016 data to SharePoint Online and automated the migration of 7TB of SharePoint 2007 data to SharePoint 2016, handling 23,000+ site collections using Sharegate, METALOGIX, and PowerShell scripts, ensuring seamless transitions with minimal downtime.
            •	Custom Migration Validation Solutions: Developed PowerShell-based custom migration validation solutions to ensure data integrity and prevent loss during migrations, utilizing database tables, SQL queries, and pre- and post-migration reports.
            •	Intranet Portal and SPFx Development: Led the development of a SharePoint Online Intranet Portal, achieving a 50% increase in user engagement through enhanced UI and customization. Developed SPFx Apps such as Custom Site Alerts, Search Webpart, and Stock Ticker to enhance user productivity.
            •	Custom Development and Governance: Created custom web parts, responsive UI, central navigation bars, page layouts, and design templates in SharePoint 2016 using CSOM, JavaScript, HTML, and CSS. Implemented governance policies to maintain data integrity, compliance, and security within SharePoint environments.
            •	Training, Support, and Maintenance: Conducted "App in a Day" training classes to empower Citizen Developers in creating and managing Canvas Apps and Flows. Delivered SharePoint Level 100 and 200 classes, managed ServiceNow/Remedy work orders and incidents, provided post-migration support, performed quarterly patching on SharePoint 2016, and led an offshore team to ensure operational continuity.


            
